name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-prod
jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      pr_merged: ${{ steps.check_pr.outputs.merged }}
      pr_number: ${{ steps.check_pr.outputs.pr_number }}
    steps:
      - name: Verificar que el commit viene de un PR mergeado
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh pr list --repo ${{ github.repository }} \
            --search "${{ github.sha }}" \
            --state merged \
            --json number,mergeCommit \
            --jq '.[0]')
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" = "null" ]; then
            echo "❌ El commit ${{ github.sha }} no viene de un PR mergeado."
            echo "merged=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          PR_NUMBER=$(echo $PR_DATA | jq -r '.number')
          echo "✅ Commit del PR #$PR_NUMBER (mergeado)"
          echo "merged=true" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

  deploy:
    needs: guard
    if: needs.guard.outputs.pr_merged == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/mediflow
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "$PREV_COMMIT" > /tmp/mediflow_last_deploy
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker-compose.yml up -d --build --remove-orphans
            docker image prune -f
            sleep 10
            if ! curl -fsS https://${{ secrets.APP_DOMAIN }}/api/health; then
              echo "❌ Health check falló. Haciendo rollback a $PREV_COMMIT..."
              git reset --hard $PREV_COMMIT
              docker compose -f infra/docker-compose.yml up -d --build --remove-orphans
              sleep 10
              curl -fsS https://${{ secrets.APP_DOMAIN }}/api/health
              echo "🔄 Rollback completado"
              exit 1
            fi
            echo "✅ Deploy exitoso"

      - name: Avisar a Discord (éxito)
        if: success() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST $DISCORD_WEBHOOK \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"✅ **Deploy exitoso** en MediFlow\nCommit: \`${{ github.sha }}\`\nPR: #${{ needs.guard.outputs.pr_number }}\nAutor: ${{ github.actor }}\"}"

      - name: Avisar a Discord (fallo)
        if: failure() && env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -X POST $DISCORD_WEBHOOK \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"❌ **Deploy fallido** en MediFlow\nCommit: \`${{ github.sha }}\`\nAutor: ${{ github.actor }}\nRevisar logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"