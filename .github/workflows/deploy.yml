name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd /opt/mediflow
            PREV_COMMIT=$(git rev-parse HEAD)
            rollback() {
              echo "Fallo el deploy. Rollback a $PREV_COMMIT..."
              git reset --hard "$PREV_COMMIT"
              docker compose -f infra/docker-compose.yml up -d --build --remove-orphans
            }
            trap rollback ERR
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker-compose.yml up -d --build --remove-orphans
            curl -fsS --retry 6 --retry-delay 5 --retry-connrefused https://${{ secrets.APP_DOMAIN }}/api/health
            trap - ERR
            docker image prune -f
      - name: Notificar fallo en Discord
        if: failure() && env.DISCORD_WEBHOOK != ''
        run: |
          curl -fsS -H "Content-Type: application/json" \
            -d '{"content":"Deploy fallido en ${{ github.repository }} (${{ github.sha }}); se intentó rollback."}' \
            "$DISCORD_WEBHOOK"
