name: CI
on:
  pull_request:
    branches: [main, develop]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: USE_LLM=false STORAGE_BACKEND=local pytest -q
  evals:
    if: contains(github.event.pull_request.labels.*.name, 'evals')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: USE_LLM=true python evals/run.py --golden evals/golden/plan_golden.csv --report evals/output/report.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_EVALS }}
          STORAGE_BACKEND: local